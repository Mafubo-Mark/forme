<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Forme 管理平台</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css"></head><body data-page="admin"><header class="site-header"><a class="wordmark" href="index.html">forme<span class="wordmark-dot">.</span></a><strong>管理平台</strong><a href="index.html">返回网站</a><button id="admin-logout" hidden>退出管理</button></header><main class="admin-main"><section id="admin-auth" class="account-card"><h1>管理员登录</h1><form id="admin-login"><label>账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button class="button button-dark" type="submit">登录</button><p id="admin-login-error" role="alert"></p></form></section><section id="admin-workspace" hidden><div class="admin-heading"><div><p class="eyebrow">FORME OPERATIONS</p><h1>用户与订单</h1><p>查看用户、建模记录、付款凭证与收货信息。</p><a class="button button-dark" href="/api/admin/operator/">打开本机建模工作流</a><p id="local-operator-state" role="status">正在检查 Mac 连接…</p></div><form id="user-search"><input name="q" placeholder="搜索邮箱或账号" aria-label="搜索邮箱或账号"><button class="button button-dark">搜索</button></form></div><div class="admin-layout"><aside id="admin-users"></aside><section id="admin-detail"><div class="empty-state">选择一个用户查看详情。</div></section></div></section><p id="admin-status" role="status"></p></main><script src="js/admin.js" defer></script></body></html>
